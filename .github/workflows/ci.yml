name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-repository:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required repository structure
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            ".github/workflows/ci.yml"
            "README.md"
            "ERRATA.md"
            "docs/01-pipeline-architecture"
            "docs/02-deployment-strategies"
            "docs/03-compliance-gates"
            "docs/04-database-migration"
            "docs/05-environment-promotion"
            "docs/06-rollback-specification"
            "docs/07-runbook-playbook"
            "docs/08-observability"
            "pipeline/helm"
            "pipeline/policies"
            "pipeline/scripts"
            "pipeline/terraform"
            "runbooks/deployment-runbook.md"
            "runbooks/incident-playbook.md"
            "evidence/reflections.md"
            "evidence/self-assessment.md"
            "evidence/screenshots"
            "evidence/test-results"
          )

          missing=0

          for path in "${required_paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::error file=$path::Missing required path: $path"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Confirm repository type
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "novapay" ]; then
            echo "Found novapay application directory."
          else
            echo "No novapay application directory present, which is expected here."
          fi

          if find . -maxdepth 3 \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) | grep -q .; then
            echo "Gradle project files detected."
          else
            echo "No Gradle project files detected in this repository."
          fi

      - name: Finish
        run: echo "Repository validation completed successfully."
